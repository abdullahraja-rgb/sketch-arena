services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sketch_arena}
      POSTGRES_USER: ${POSTGRES_USER:-sketch_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sketch_arena_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sketch-arena-postgres:/var/lib/postgresql

volumes:
  sketch-arena-postgres:
